<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finsistant Android App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #4CAF50;
        }
        p {
            line-height: 1.6;
            color: #cccccc;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .gallery {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 50px;
            max-width: 1200px;
        }
        .gallery img {
            width: 300px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
</head>
<body>
    <div class="container">
        <h1>Finsistant V2</h1>
        <p>Your automated trading assistant, powered by Kite Connect API and Gemini AI.</p>
        <p>This is a placeholder page for the Android application. Download links and documentation will be available here.</p>
        <a href="#" class="btn">Coming Soon</a>
    </div>

    <div class="gallery">
        <img src="assets/images/dashboard.png" alt="Dashboard Screen">
        <img src="assets/images/chatbot.png" alt="Chatbot Screen">
        <img src="assets/images/settings.png" alt="Settings Screen">
    </div>
</body>
</html>
